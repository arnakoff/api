# OpenSSF Scorecard supply-chain analysis, published to api.scorecard.dev for
# the README badge. Follows the reference workflow of ossf/scorecard and the
# publishing restrictions of ossf/scorecard-action v2.5.0 (README, checked
# 29/10/2026): no workflow-level env, defaults or write permissions, id-token
# only on the Scorecard job, and only the approved actions in that job.
# Actions are pinned by full commit SHA (docs/standards.md).
name: Scorecard

on:
  push:
    # Only the default branch is supported.
    branches: [main]
  schedule:
    - cron: "41 3 * * 6"

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Upload of the SARIF results to code scanning.
      security-events: write
      # OIDC token required by publish_results.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
