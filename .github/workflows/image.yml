# Container image published to ghcr.io/arnakoff/api for every version tag
# that release-please creates (#69, docs/standards.md, Supply chain).
#
# - The tag is pushed with the arnakoff GitHub App token (release-please.yml),
#   so it triggers this workflow; a tag pushed with GITHUB_TOKEN would not.
# - linux/amd64 and linux/arm64: the Dockerfile cross-compiles on the build
#   platform and the final stage only copies files, so no QEMU is needed.
# - SBOM and max-level provenance attestations are generated by BuildKit and
#   pushed with the image (docker/build-push-action README and the Docker
#   "Attestations" guide, checked 03/11/2026).
# - The image index is signed by its digest with cosign keyless signing: the
#   GitHub OIDC token of this job is exchanged for a short-lived Sigstore
#   certificate, recorded in the Rekor transparency log. Verification command
#   in the README.
# - No build cache: a release is built from scratch, so no cache entry written
#   by another workflow run can reach a published image.
#
# Actions are pinned by full commit SHA (docs/standards.md, verified 03/11/2026).
name: Image

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Push to ghcr.io/arnakoff/api.
      packages: write
      # OIDC token for the keyless cosign signature.
      id-token: write
    env:
      IMAGE: ghcr.io/arnakoff/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tags 1.2.3, 1.2 and latest from the vX.Y.Z git tag. Only the tags are
      # used: the OCI labels stay those of the Dockerfile.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          sbom: true
          provenance: mode=max
      # Signing the index digest covers every tag pointing to it; --recursive
      # also signs the image of each platform.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes --recursive "${IMAGE}@${DIGEST}"
      - name: Publish the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo '## Image'
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
