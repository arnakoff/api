# Publishes server.json to the official MCP registry for every version tag
# that release-please creates (#278), as com.arnakoff/api.
#
# - The tag is pushed with the arnakoff GitHub App token (release-please.yml),
#   so it triggers this workflow, as it does image.yml.
# - mcp-publisher is a pinned release, checked with cosign against the
#   identity of the registry's release workflow for that tag (registry docs,
#   docs/modelcontextprotocol-io/github-actions.mdx; identity read from the
#   certificate of the v1.8.7 bundle, 04/11/2026).
# - DNS authentication: the Ed25519 private key (64 hex characters) is the
#   MCP_PRIVATE_KEY secret of the mcp-registry environment, which only v*
#   tags may use (docs/deploy.md). The "version tags" ruleset lets only the
#   release app create, move or delete a v* tag, so no other writer can run
#   a commit of theirs with this secret. mcp-publisher takes it only as the
#   -private-key flag (cmd/publisher/commands/login.go, v1.8.7): it reaches
#   the step through an environment variable, never through an expression in
#   the script.
# - The registry keeps every version it publishes and refuses to change one:
#   the job stops before login if server.json does not carry the tag version.
#
# Actions are pinned by full commit SHA (docs/standards.md).
name: MCP registry

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: mcp-registry
    permissions:
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the version of server.json
        run: |
          want="${GITHUB_REF_NAME#v}"
          got="$(jq -r .version server.json)"
          if [ "$got" != "$want" ]; then
            echo "::error file=server.json::version is ${got}, the tag is ${GITHUB_REF_NAME}"
            exit 1
          fi
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar -xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Validate server.json
        run: ./mcp-publisher validate server.json
      - name: Log in to the registry
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: ./mcp-publisher login dns --domain arnakoff.com --private-key "$MCP_PRIVATE_KEY"
      - name: Publish
        run: ./mcp-publisher publish server.json
      # The registry token lives in ~/.config/mcp-publisher until then.
      - name: Log out
        if: always()
        run: '[ ! -x ./mcp-publisher ] || ./mcp-publisher logout'
