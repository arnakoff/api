# Deploys a published version to Scaleway, fr-par (ADR 0005, #71).
#
# - Runs after the Image workflow published a version tag, or by hand for any
#   version (rollback: run it with the previous version). The environment
#   `production` requires the owner's approval and accepts main only.
# - Verifies the cosign signature of the image published on GHCR, then copies
#   its linux/amd64 image, by digest, to Scaleway Container Registry: Scaleway
#   containers accept linux/amd64 only and discourage external registries.
# - Writes the secrets of the environment into the container and into the
#   Secret Manager versions of the sync job (ADR 0005, Secrets), then deploys
#   the digest. The bucket keys are the rotate job's, never written here
#   (ADR 0007). OpenTofu (deploy/tofu) owns everything else.
# - The scw CLI is a pinned release binary checked against its SHA256SUMS.
#
# Actions are pinned by full commit SHA (docs/standards.md).
name: Deploy

on:
  workflow_run:
    workflows: [Image]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Version to deploy, such as 0.51.0
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    name: Deploy
    # A workflow_run fires for any workflow named Image, including one a
    # fork pull request defines: only the Image workflow of this repository,
    # run by a tag push, may start a deployment (#342).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/image.yml')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      # Read ghcr.io/arnakoff/api.
      packages: read
    env:
      IMAGE: ghcr.io/arnakoff/api
      TARGET: rg.fr-par.scw.cloud/arnakoff/api
      SCW_CLI_VERSION: 2.65.2
      SCW_CLI_SHA256: 184e697e6ab8a8e825be1c5cf61d104341abe3598bb0e20b7a54618cb05231b3
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_ORGANIZATION_ID: ${{ vars.SCW_DEFAULT_ORGANIZATION_ID }}
      SCW_DEFAULT_PROJECT_ID: ${{ vars.SCW_DEFAULT_PROJECT_ID }}
      SCW_DEFAULT_REGION: ${{ vars.SCW_DEFAULT_REGION }}
    steps:
      - name: Resolve the version
        id: version
        env:
          INPUT: ${{ inputs.version }}
          # For a tag push, head_branch is the tag (vX.Y.Z); checked by the
          # version pattern below.
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          v="${INPUT:-${TAG#v}}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::not a version: $v"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The signature names the Image workflow at the version's tag (README).
      - name: Verify the signature and find the linux/amd64 digest
        id: image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          index="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
          identity="https://github.com/arnakoff/api/.github/workflows/image.yml@refs/tags/v${VERSION}"
          issuer=https://token.actions.githubusercontent.com
          cosign verify "${IMAGE}@${index}" --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" > /dev/null
          amd64="$(docker buildx imagetools inspect "${IMAGE}@${index}" --raw \
            | jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest')"
          if [ -z "$amd64" ]; then
            echo "::error::no linux/amd64 image in ${IMAGE}@${index}"
            exit 1
          fi
          # --recursive signing covers each platform's image too.
          cosign verify "${IMAGE}@${amd64}" --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" > /dev/null
          echo "amd64=$amd64" >> "$GITHUB_OUTPUT"
      - name: Copy the image to Scaleway Container Registry
        env:
          VERSION: ${{ steps.version.outputs.version }}
          AMD64: ${{ steps.image.outputs.amd64 }}
        run: |
          docker login rg.fr-par.scw.cloud/arnakoff -u nologin --password-stdin <<< "$SCW_SECRET_KEY"
          docker buildx imagetools create --tag "${TARGET}:${VERSION}" "${IMAGE}@${AMD64}"
          # imagetools create wraps the manifest in a new index, so the tag
          # has another digest; the manifest keeps its own, which is the
          # reference deployed below.
          if ! docker buildx imagetools inspect "${TARGET}@${AMD64}" > /dev/null; then
            echo "::error::${TARGET}@${AMD64} is not in Container Registry"
            exit 1
          fi
      - name: Install the scw CLI
        run: |
          curl -fsSL -o scw "https://github.com/scaleway/scaleway-cli/releases/download/v${SCW_CLI_VERSION}/scaleway-cli_${SCW_CLI_VERSION}_linux_amd64"
          echo "${SCW_CLI_SHA256}  scw" | sha256sum --check --strict
          install -m 0755 scw /usr/local/bin/scw
          rm scw
      # The bucket keys of the sync job are the rotate job's (ADR 0007,
      # #308): the deploy writes its log key only.
      - name: Write the secrets of the sync job
        env:
          SECRET_IDS: ${{ vars.SCW_SYNC_SECRET_IDS }}
          ARNAKOFF_LOG_KEY: ${{ secrets.ARNAKOFF_LOG_KEY }}
        run: |
          umask 077
          for name in ARNAKOFF_LOG_KEY; do
            id="$(jq -er --arg n "$name" '.[$n]' <<< "$SECRET_IDS")"
            if [ -z "${!name}" ]; then
              echo "::error::${name} of the sync job is not set"
              exit 1
            fi
            printf '%s' "${!name}" > "$RUNNER_TEMP/secret"
            scw secret version create secret-id="$id" data=@"$RUNNER_TEMP/secret" disable-previous=true -o json > /dev/null
          done
          rm -f "$RUNNER_TEMP/secret"
      - name: Deploy the sync job
        env:
          JOB_ID: ${{ vars.SCW_JOB_DEFINITION_ID }}
          AMD64: ${{ steps.image.outputs.amd64 }}
        run: scw jobs definition update "$JOB_ID" image-uri="${TARGET}@${AMD64}" -o json > /dev/null
      # The rotate job is not deployed here: it lives in a project where
      # ci-deploy has no right, its image pinned by digest by the owner
      # (deploy/tofu/rotate.tf, #340).
      # The bucket keys and the SMTP password of the container are the
      # rotate job's (ADR 0007, #308, #295): this update must keep them. The containers/v1 API of the scw
      # CLI replaces the whole table of secrets (in the cassettes of the
      # Terraform provider v2.91.0, a PATCH without a secret drops it,
      # container-env). containers/v1beta1 keeps the secrets it is not
      # given (scaleway-sdk-go v1.39.0, UpdateContainerRequest) and the CLI
      # has no command for it: one PATCH sets the image and these secrets,
      # through a file, then the step waits until the container is ready,
      # 12 min 30 s at most as --wait did (CLI containerDeployTimeout).
      - name: Deploy the api container
        env:
          CONTAINER_ID: ${{ vars.SCW_CONTAINER_ID }}
          AMD64: ${{ steps.image.outputs.amd64 }}
          ARNAKOFF_LOG_KEY: ${{ secrets.ARNAKOFF_LOG_KEY }}
          ARNAKOFF_API_KEY_SECRET: ${{ secrets.ARNAKOFF_API_KEY_SECRET }}
          ARNAKOFF_DATABASE_URL: ${{ secrets.ARNAKOFF_DATABASE_URL }}
          ARNAKOFF_TURNSTILE_SECRET: ${{ secrets.ARNAKOFF_TURNSTILE_SECRET }}
        run: |
          umask 077
          url="https://api.scaleway.com/containers/v1beta1/regions/${SCW_DEFAULT_REGION}/containers/${CONTAINER_ID}"
          jq -n --arg image "${TARGET}@${AMD64}" '{registry_image: $image, secret_environment_variables: [
              $ENV | to_entries[]
              | select(.key | IN("ARNAKOFF_LOG_KEY", "ARNAKOFF_API_KEY_SECRET", "ARNAKOFF_DATABASE_URL",
                  "ARNAKOFF_TURNSTILE_SECRET"))
              | select(.value != "") | {key, value}]}' > "$RUNNER_TEMP/update.json"
          curl -fsS --max-time 30 -X PATCH -H "X-Auth-Token: ${SCW_SECRET_KEY}" -H "Content-Type: application/json" \
            --data @"$RUNNER_TEMP/update.json" "$url" > /dev/null
          rm -f "$RUNNER_TEMP/update.json"
          for _ in $(seq 75); do
            sleep 10
            container="$(curl -fsS --max-time 30 -H "X-Auth-Token: ${SCW_SECRET_KEY}" "$url")"
            case "$(jq -r .status <<< "$container")" in
              ready) exit 0 ;;
              error | locked)
                echo "::error::api container $(jq -r '.status + ": " + (.error_message // "no message")' <<< "$container")"
                exit 1
                ;;
            esac
          done
          echo "::error::api container not ready after 12 min 30 s"
          exit 1
      # The backup container (deploy/tofu/backup.tf, #75), once
      # SCW_BACKUP_CONTAINER_ID is set: the backup_container_id output of
      # deploy/tofu. Its database URL is that of arnakoff_backup, which may
      # only read; its bucket keys may only add objects (deploy/tofu-aws).
      - name: Deploy the backup container
        if: vars.SCW_BACKUP_CONTAINER_ID != ''
        env:
          CONTAINER_ID: ${{ vars.SCW_BACKUP_CONTAINER_ID }}
          AMD64: ${{ steps.image.outputs.amd64 }}
          ARNAKOFF_LOG_KEY: ${{ secrets.ARNAKOFF_LOG_KEY }}
          ARNAKOFF_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          ARNAKOFF_BACKUP_BUCKET_ACCESS_KEY: ${{ secrets.BACKUP_BUCKET_ACCESS_KEY }}
          ARNAKOFF_BACKUP_BUCKET_SECRET_KEY: ${{ secrets.BACKUP_BUCKET_SECRET_KEY }}
          # Signs each dump, so that a restore can tell the backup job made it
          # (#340, point 3).
          ARNAKOFF_BACKUP_SIGNING_KEY: ${{ secrets.BACKUP_SIGNING_KEY }}
        run: |
          args=()
          for name in ARNAKOFF_LOG_KEY ARNAKOFF_DATABASE_URL ARNAKOFF_BACKUP_BUCKET_ACCESS_KEY ARNAKOFF_BACKUP_BUCKET_SECRET_KEY ARNAKOFF_BACKUP_SIGNING_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} of the backup container is not set"
              exit 1
            fi
            args+=("secret-environment-variables.${name}=${!name}")
          done
          scw container container update "$CONTAINER_ID" image="${TARGET}@${AMD64}" "${args[@]}" --wait -o json > /dev/null
      # SCW_CONTAINER_ENDPOINT is the container_endpoint output of deploy/tofu.
      - name: Check the deployed API
        env:
          ENDPOINT: ${{ vars.SCW_CONTAINER_ENDPOINT }}
          VERSION: ${{ steps.version.outputs.version }}
          AMD64: ${{ steps.image.outputs.amd64 }}
        run: |
          curl -fsS --max-time 10 --retry 5 --retry-all-errors "${ENDPOINT}/readyz" > /dev/null
          {
            echo '## Deployed'
            echo
            echo "Version ${VERSION}, ${TARGET}@${AMD64}, ${ENDPOINT}"
          } >> "$GITHUB_STEP_SUMMARY"
