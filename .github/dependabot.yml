# Dependabot version updates (docs/standards.md, supply chain).
# Options checked on 29/10/2026 against the GitHub "Dependabot options reference".
# Commit prefixes follow Conventional Commits: `prefix` plus `include: scope`
# gives `build(deps): …` and `ci(deps): …`.
# The `docker` ecosystem updates the images of the Dockerfile (#68), tag and
# digest together. It takes the same cooldown as `github-actions`
# (`default-days` only, no SemVer variants).
#
# Cooldown (#90): a new release is proposed only after it has been public for
# a while, which leaves time for a compromised or broken version to be found
# and yanked before a PR suggests it. 7 days by default, 30 for Go major
# versions, which change APIs and get the most scrutiny. Cooldown only delays
# version updates; security updates are never delayed.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 7
      semver-major-days: 30
    labels:
      - type:chore
    groups:
      gomod-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    cooldown:
      default-days: 7
    labels:
      - type:chore
      - area:ci
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 7
    labels:
      - type:chore
    groups:
      docker-minor-patch:
        update-types:
          - minor
          - patch
